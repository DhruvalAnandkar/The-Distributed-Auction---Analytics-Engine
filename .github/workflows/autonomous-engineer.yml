name: Autonomous Engineer

# Implements ONE task from TASKS.json per run, verifies it against the full test
# suite, and opens a pull request. Nothing reaches main without passing tests.
#
# Security model:
# - Model-written code only ever runs inside `node scripts/agent/run.mjs`, whose
#   test runner gets an allow-listed environment (no API keys, no tokens).
# - The checkout does NOT persist git credentials, so code run during the agent
#   step cannot push. Credentials are added only in the later publish step.
# - Only the files listed in .agent-out/files.txt are committed.
# - Third-party actions are pinned to full commit SHAs.

on:
  schedule:
    - cron: '30 23 * * *' # main run: 7:30 PM US Eastern (daylight time)
    - cron: '30 3 * * *'  # backup run: 11:30 PM Eastern, only if the main run produced nothing
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Run a specific task id from TASKS.json (blank = next pending)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: autonomous-engineer
  cancel-in-progress: false

jobs:
  # Keeps output at about one PR per day: a scheduled run does nothing if an
  # agent PR is still open or one was opened in the last 20 hours.
  # Manual runs always proceed.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "schedule" ]; then echo "proceed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          since=$(date -u -d '-20 hours' +%Y-%m-%dT%H:%M:%SZ)
          recent=$(gh pr list --repo "$GITHUB_REPOSITORY" --state all --author 'app/github-actions' --limit 30 \
            --json createdAt,state --jq "[.[] | select(.state == \"OPEN\" or .createdAt > \"$since\")] | length")
          echo "agent PRs open or opened since $since: $recent"
          if [ "$recent" = "0" ]; then echo "proceed=true" >> "$GITHUB_OUTPUT"; else echo "proceed=false" >> "$GITHUB_OUTPUT"; fi

  engineer:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
      pull-requests: write
    env:
      # Repo variable AUTO_MERGE=false -> agent PRs wait for your review.
      AUTO_MERGE: ${{ vars.AUTO_MERGE || 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run agent
        id: agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TASK_ID: ${{ inputs.task_id }}
        run: node scripts/agent/run.mjs

      - name: Configure git
        if: steps.agent.outputs.status == 'success' || steps.agent.outputs.status == 'failed'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "DhruvalAnandkar"
          git config user.email "dhruvalabroad@gmail.com"
          gh auth setup-git

      - name: Open pull request
        if: steps.agent.outputs.status == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.agent.outputs.branch }}
          TITLE: ${{ steps.agent.outputs.title }}
        run: |
          git switch -c "$BRANCH"
          git add --pathspec-from-file=.agent-out/files.txt
          git commit -F .agent-out/commit-message.txt
          git push --force origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file .agent-out/pr-body.md
          if [ "$AUTO_MERGE" = "true" ]; then
            gh pr merge "$BRANCH" --squash --delete-branch
          fi

      - name: Record failed attempt
        if: steps.agent.outputs.status == 'failed'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TASK_ID: ${{ steps.agent.outputs.task_id }}
        run: |
          git add TASKS.json
          git commit -m "chore(agent): record failed attempt on ${TASK_ID}"
          git push origin HEAD:main

      - name: Upload agent report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-report
          path: .agent-out/
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail the run if the agent could not finish
        if: steps.agent.outputs.status == 'failed'
        run: |
          cat .agent-out/failure.md
          exit 1
