name: Autonomous Code Documenter

on:
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-document:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Gemini SDK
        run: npm install @google/generative-ai

      - name: Run autonomous code documenter
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/auto-documenter.js

      - name: Commit and push documented files
        run: |
          git config --global user.name "DhruvalAnandkar"
          git config --global user.email "dhruvalabroad@gmail.com"
          git add -- '*.js' 'apps/**/*.js'
          git diff --cached --quiet || git commit -m "docs: autonomously generate JSDoc comments for API gateway"
          git push origin HEAD:main
